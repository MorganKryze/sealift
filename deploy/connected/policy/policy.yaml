# sealift's policy. Every key below is commented out, so this file
# changes nothing until you edit it: a new instance keeps the defaults,
# and an upgraded one keeps the values it saved in Settings. A key you
# uncomment replaces the saved value. The values shown are the defaults.

# targets:
#   # A target is whole: set all five fields or leave the target out.
#   npm:
#     os: linux
#     cpu: x64
#     libc: glibc
#     node: 22.17.1
#     pnpm: 10.34.5
#   pip:
#     python: 3.11.2
#     os: linux
#     cpu: x86_64
#     glibc: "2.28"
#     uv: 0.13.7

# How many days a release must be public before sealift proposes it,
# 1 to 90.
# minReleaseAgeDays: 14

# parallelism:
#   # Candidate versions an analysis resolves at once, 1 to 16.
#   resolve: 4
#   # Packages an export downloads at once, 1 to 32.
#   download: 16

