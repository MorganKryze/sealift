openapi: 3.1.0
info:
  title: sealift
  version: "1"
  description: >
    Scans a pnpm project for CVEs, ranks newer dependency versions, and
    builds an archive for an air-gapped Nexus import.
servers:
  - url: /api
tags:
  - name: projects
    description: Project creation, target and history
  - name: analyses
    description: Dependency scan and ranking jobs
  - name: exports
    description: Archive jobs and their files
  - name: jobs
    description: The running job's event stream
  - name: settings
    description: User-configurable defaults
  - name: tools
    description: pnpm and Trivy installs and updates
paths:
  /projects:
    get:
      operationId: listProjects
      tags:
        - projects
      summary: List projects with their last analysis and export
      parameters:
        - name: manifestSha256
          in: query
          required: false
          schema:
            type: string
          description: >
            Filter to the projects created from this exact manifest hash
            (sha256 of the uploaded bytes, lowercase hex), newest first
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProject
      tags:
        - projects
      summary: Create a project from an uploaded package.json or requirements files
      description: >-
        An npm project (the default) takes a manifest and a pip project
        takes one to 32 requirements parts and an optional pipTarget; either
        queues its first analysis. The request holds at most 40 parts. A
        requirements part above 1 MiB is refused, never cut.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                ecosystem:
                  $ref: "#/components/schemas/Ecosystem"
                name:
                  type: string
                  description: >-
                    Project name; an npm project defaults to the manifest name
                    field, a pip project requires it
                manifest:
                  type: string
                  format: binary
                  description: package.json content, required for an npm project
                requirements:
                  type: array
                  description: >-
                    Requirements files of a pip project, repeated. Each part's
                    filename is the file name.
                  items:
                    type: string
                    format: binary
                pipTarget:
                  type: string
                  description: >-
                    JSON of a PipTarget, at most 4 KiB, unknown fields refused.
                    The default target applies when absent.
      responses:
        "201":
          description: Project created, analysis queued for an npm project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags:
        - projects
      summary: Get a project, its target and its history
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteProject
      tags:
        - projects
      summary: Delete the project directory
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/target:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: setProjectTarget
      tags:
        - projects
      summary: Change the project's target platform and toolchain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Target"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: queueAnalysis
      tags:
        - analyses
      summary: Queue an analysis for the project
      responses:
        "202":
          description: Analysis queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses/{analysisId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AnalysisId"
    get:
      operationId: getAnalysis
      tags:
        - analyses
      summary: Get an analysis' status and results
      responses:
        "200":
          description: Analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAnalysis
      tags:
        - analyses
      summary: Delete an analysis
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/manifest:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectManifest
      tags:
        - projects
      summary: Get the package.json a project was created from, byte for byte
      responses:
        "200":
          description: The uploaded package.json
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses/{analysisId}/log:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AnalysisId"
    get:
      operationId: getAnalysisLog
      tags:
        - analyses
      summary: Get an analysis' full log
      responses:
        "200":
          description: Plain text log
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses/{analysisId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AnalysisId"
    post:
      operationId: cancelAnalysis
      tags:
        - analyses
      summary: Cancel a running or queued analysis
      responses:
        "200":
          description: Analysis after the cancel request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses/{analysisId}/exports:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AnalysisId"
    post:
      operationId: queueExport
      tags:
        - exports
      summary: Queue an export with a version selection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          description: Export queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/exports/{exportId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExportId"
    get:
      operationId: getExport
      tags:
        - exports
      summary: Get an export's status and files
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteExport
      tags:
        - exports
      summary: Delete an export
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/exports/{exportId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExportId"
    post:
      operationId: cancelExport
      tags:
        - exports
      summary: Cancel a running or queued export
      responses:
        "200":
          description: Export after the cancel request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/exports/{exportId}/files/{name}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExportId"
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]+$'
        description: File name inside the export directory
    get:
      operationId: downloadExportFile
      tags:
        - exports
      summary: Download one file of a finished export
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /jobs/current/events:
    get:
      operationId: watchJob
      tags:
        - jobs
      summary: Server-sent events of the running job
      description: >
        Streams the five event kinds of the job queue: step, progress,
        candidate, log, end. Replays the running job's events so far, then
        streams live ones. The stream ends after the end event.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
        default:
          $ref: "#/components/responses/Problem"
  /settings:
    get:
      operationId: getSettings
      tags:
        - settings
      summary: Get settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateSettings
      tags:
        - settings
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"
  /instance:
    get:
      operationId: getInstance
      tags:
        - settings
      summary: How this instance was deployed
      responses:
        "200":
          description: The deployment mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        default:
          $ref: "#/components/responses/Problem"
  /signing-key:
    get:
      operationId: getSigningKey
      tags:
        - settings
      summary: The public half of the key that signs exports
      responses:
        "200":
          description: The public key in PEM form and its public key sha256
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKey"
        default:
          $ref: "#/components/responses/Problem"
  /signing-key/regenerate:
    post:
      operationId: regenerateSigningKey
      tags:
        - settings
      summary: Replace the signing key with a new pair
      description: >-
        Answers 403 for a Host or an Origin that is not this server's own, for
        Sec-Fetch-Site cross-site, and for a body that is not application/json.
        The old key stays in use when the new one cannot be written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Empty. The body exists so that a cross-site form post cannot send this request.
      responses:
        "200":
          description: The new public key and its public key sha256
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKey"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /tools:
    get:
      operationId: getTools
      tags:
        - tools
      summary: Installed and available tool versions, DB date
      responses:
        "200":
          description: Tools state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsState"
        default:
          $ref: "#/components/responses/Problem"
  /tools/trivy/update:
    post:
      operationId: updateTrivy
      tags:
        - tools
      summary: Install a new Trivy release
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - force
              properties:
                version:
                  type: string
                  description: >
                    Install this release instead of the latest, such as the
                    ToolsState.trivyRecommended version. Still subject to
                    the minimum age check unless force is set.
                force:
                  type: boolean
                  description: Install the latest release regardless of its age
      responses:
        "200":
          description: Tools state after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsState"
        default:
          $ref: "#/components/responses/Problem"
  /tools/trivy/activate:
    post:
      operationId: activateTrivy
      tags:
        - tools
      summary: Activate an installed Trivy version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              properties:
                version:
                  type: string
      responses:
        "200":
          description: Tools state after the activation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsState"
        default:
          $ref: "#/components/responses/Problem"
  /tools/uv/install:
    post:
      operationId: installUv
      tags:
        - tools
      summary: Install a uv release from the package index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              properties:
                version:
                  type: string
                  description: The uv release to install, such as 0.13.7
                force:
                  type: boolean
                  description: Install the release even when it is younger than the minimum release age
      responses:
        "200":
          description: Tools state after the install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsState"
        default:
          $ref: "#/components/responses/Problem"
  /tools/trivy/db/update:
    post:
      operationId: updateTrivyDB
      tags:
        - tools
      summary: Force a Trivy DB download
      responses:
        "200":
          description: Tools state after the DB update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsState"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem type
          default: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type
        status:
          type: integer
          description: The HTTP status code repeated for clients that read the body only
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence
        instance:
          type: string
          format: uri
          description: A URI identifying this specific occurrence
        errors:
          type: array
          description: >-
            The offending entries of a validation failure, at most 100; the
            detail gives the total when there are more
          items:
            $ref: "#/components/schemas/ProblemDetail"
        missing:
          type: array
          description: Names of what a tools-missing problem needs and does not have yet
          items:
            type: string
      required:
        - title
        - status
    ProblemDetail:
      type: object
      description: One offending entry inside a validation failure's errors list
      properties:
        field:
          type: string
          description: >-
            package.json field, such as dependencies or pnpm.overrides, or the
            file name of a requirements problem
        line:
          type: integer
          description: Line of a requirements problem, absent for a problem of the whole file
        name:
          type: string
          description: Dependency name, empty for a field-level problem
        value:
          type: string
        reason:
          type: string
      required:
        - field
        - reason
    State:
      type: string
      description: State of a job and of the directory it writes
      enum:
        - queued
        - running
        - done
        - failed
        - cancelled
        - interrupted
    Target:
      type: object
      description: The system a resolution or an export is prepared for
      properties:
        os:
          type: string
          example: linux
        cpu:
          type: string
          example: x64
        libc:
          type: string
          example: glibc
        node:
          type: string
          example: 22.17.1
        pnpmVer:
          type: string
          example: 10.34.5
      required:
        - os
        - cpu
        - libc
        - node
        - pnpmVer
    Ecosystem:
      type: string
      description: The package manager a project belongs to
      enum:
        - npm
        - pip
    PipTarget:
      type: object
      description: The system a pip resolution is prepared for
      properties:
        python:
          type: string
          description: Python 3.<minor>.<patch>
          example: 3.11.2
        os:
          type: string
          example: linux
        cpu:
          type: string
          description: Only x86_64 for now
          example: x86_64
        glibc:
          type: string
          description: glibc 2.17 to 2.40
          example: "2.28"
        uvVer:
          type: string
          example: 0.13.7
      required:
        - python
        - os
        - cpu
        - glibc
        - uvVer
    Instance:
      type: object
      description: >-
        How this instance was deployed. In ephemeral mode, a project and the
        shared caches are erased when it is deleted, and every project is
        deleted once it has been idle for idleMinutes.
      properties:
        ephemeral:
          type: boolean
        idleMinutes:
          type: integer
          description: Present in ephemeral mode only.
      required:
        - ephemeral
    Settings:
      type: object
      description: Every value the interface can change.
      properties:
        target:
          $ref: "#/components/schemas/Target"
        minReleaseAgeDays:
          type: integer
        resolveParallelism:
          type: integer
        downloadParallelism:
          type: integer
      required:
        - target
        - minReleaseAgeDays
        - resolveParallelism
        - downloadParallelism
    SigningKey:
      type: object
      description: The public half of the key that signs exports. The private half is never served.
      properties:
        publicKeyPem:
          type: string
          description: One PKIX PUBLIC KEY PEM block
        publicKeySha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Lowercase hex sha256 of the key's DER SubjectPublicKeyInfo
      required:
        - publicKeyPem
        - publicKeySha256
    ProjectSummary:
      type: object
      description: One row of the projects list.
      properties:
        id:
          type: string
        name:
          type: string
        ecosystem:
          $ref: "#/components/schemas/Ecosystem"
        target:
          $ref: "#/components/schemas/Target"
        pipTarget:
          $ref: "#/components/schemas/PipTarget"
        lastAnalysis:
          $ref: "#/components/schemas/Analysis"
        lastExport:
          $ref: "#/components/schemas/Export"
      required:
        - id
        - name
        - ecosystem
    Project:
      type: object
      description: >-
        A project, its target and its analysis and export history. An npm
        project has a target, a pip project has a pipTarget.
      properties:
        id:
          type: string
        name:
          type: string
        ecosystem:
          $ref: "#/components/schemas/Ecosystem"
        target:
          $ref: "#/components/schemas/Target"
        pipTarget:
          $ref: "#/components/schemas/PipTarget"
        manifestSha256:
          type: string
          description: sha256 of the uploaded package.json bytes, lowercase hex
        analyses:
          type: array
          items:
            $ref: "#/components/schemas/Analysis"
        exports:
          type: array
          items:
            $ref: "#/components/schemas/Export"
      required:
        - id
        - name
        - ecosystem
    Analysis:
      type: object
      description: One analysis job and its state.
      properties:
        id:
          type: string
        projectId:
          type: string
        state:
          $ref: "#/components/schemas/State"
        createdAt:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/AnalysisResult"
        trivyVersion:
          type: string
          description: Trivy version the analysis used, absent when it did not record one
        trivyDbDate:
          type: string
          format: date-time
          description: Vulnerability database date the analysis used, absent when it did not record one
        pnpmVersion:
          type: string
          description: pnpm version the analysis used, absent when it did not record one
        pipResult:
          $ref: "#/components/schemas/PipAnalysisResult"
        uvVersion:
          type: string
          description: uv version a pip analysis used, absent when it did not record one
        failure:
          $ref: "#/components/schemas/Failure"
      required:
        - id
        - projectId
        - state
        - createdAt
    Failure:
      type: object
      description: Which step failed and why
      properties:
        step:
          type: string
        message:
          type: string
      required:
        - step
        - message
    Vector:
      type: array
      description: CVE counts by severity, critical to unknown
      items:
        type: integer
      minItems: 5
      maxItems: 5
    Cve:
      type: object
      description: One vulnerability behind a Vector count
      properties:
        id:
          type: string
          example: CVE-2024-29041
        severity:
          type: string
          description: As Trivy prints it, upper case
          example: HIGH
      required:
        - id
        - severity
    Signal:
      type: object
      description: One reason a candidate is blocked or worth a second look
      properties:
        name:
          type: string
        evidence:
          type: string
        blocking:
          type: boolean
      required:
        - name
        - evidence
        - blocking
    Candidate:
      type: object
      description: One newer version of a dependency, ranked against the current one
      properties:
        version:
          type: string
        vector:
          $ref: "#/components/schemas/Vector"
        cves:
          type: array
          description: The vulnerabilities behind vector, sorted by severity then id
          items:
            $ref: "#/components/schemas/Cve"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        key:
          type: boolean
          description: Whether this candidate was resolved and scanned before the rest
        resolved:
          type: boolean
        published:
          type: string
          format: date-time
          description: Empty when the registry has no publication time
      required:
        - version
        - vector
        - cves
        - signals
        - key
        - resolved
    DependencyResult:
      type: object
      description: One direct dependency's current CVEs and its ranked candidates
      properties:
        name:
          type: string
        current:
          type: string
        best:
          type: string
          description: Empty when no candidate improves on the current version
        vector:
          $ref: "#/components/schemas/Vector"
        cves:
          type: array
          description: The vulnerabilities behind vector, sorted by severity then id
          items:
            $ref: "#/components/schemas/Cve"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
      required:
        - name
        - current
        - vector
        - cves
        - candidates
    AnalysisResult:
      type: object
      description: What an analysis writes to candidates.json and ranking.json
      properties:
        target:
          $ref: "#/components/schemas/Target"
        before:
          $ref: "#/components/schemas/Vector"
        after:
          allOf:
            - $ref: "#/components/schemas/Vector"
          nullable: true
          x-omitempty: false
          description: Null when the combined check (step 9) never measured it
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencyResult"
        warnings:
          type: array
          items:
            type: string
      required:
        - target
        - before
        - dependencies
        - warnings
    PipAnalysisResult:
      type: object
      description: >-
        What a pip analysis writes to pip-result.json: the set resolved from
        the project's files, each package with its findings. A pip analysis
        proposes no other version.
      properties:
        target:
          $ref: "#/components/schemas/PipTarget"
        files:
          type: array
          description: Every requirements file the set was resolved from
          items:
            type: string
        packages:
          type: array
          description: The resolved set, sorted by normalized name
          items:
            $ref: "#/components/schemas/PipPackage"
        blocking:
          type: array
          description: Packages with no wheel the target can install
          items:
            $ref: "#/components/schemas/PipBlocking"
        warnings:
          type: array
          items:
            type: string
      required:
        - target
        - files
        - packages
        - blocking
        - warnings
    PipPackage:
      type: object
      description: One package of a pip analysis' set
      properties:
        name:
          type: string
          description: Normalized name
          example: jinja2
        version:
          type: string
          example: 3.1.2
        files:
          type: array
          description: The project files that pin it, empty for a transitive package
          items:
            type: string
        wheel:
          $ref: "#/components/schemas/PipWheel"
        cves:
          type: array
          description: Sorted by severity, then id
          items:
            $ref: "#/components/schemas/PipFinding"
      required:
        - name
        - version
        - files
        - cves
    PipWheel:
      type: object
      description: The wheel chosen for a package, as the index lists it
      properties:
        file:
          type: string
        url:
          type: string
        sha256:
          type: string
          description: Lowercase hex
        size:
          type: integer
          format: int64
          description: Bytes
      required:
        - file
        - url
        - sha256
        - size
    PipFinding:
      type: object
      description: One known vulnerability of a pip package
      properties:
        id:
          type: string
          example: CVE-2024-22195
        severity:
          type: string
          description: As Trivy prints it, upper case
          example: MEDIUM
        fixedVersions:
          type: array
          description: The versions that fix it, as Trivy lists them, empty when none is known
          items:
            type: string
        title:
          type: string
      required:
        - id
        - severity
        - fixedVersions
    PipBlocking:
      type: object
      description: A package the target cannot install from a wheel
      properties:
        name:
          type: string
        version:
          type: string
        kind:
          type: string
          enum:
            - source-only
            - other-platforms
            - no-files
            - hash-mismatch
        detail:
          type: string
      required:
        - name
        - version
        - kind
        - detail
    ExportRequest:
      type: object
      description: A selection of versions per dependency, plus the project tree flag
      properties:
        selection:
          type: object
          description: >
            Dependency name to the list of its versions to include. An
            empty or absent list selects nothing for that dependency.
          additionalProperties:
            type: array
            items:
              type: string
        includeProject:
          type: boolean
          default: false
          description: Add the current project tree to the export
      required:
        - selection
    Export:
      type: object
      description: One export job, its state and its files.
      properties:
        id:
          type: string
        projectId:
          type: string
        analysisId:
          type: string
        state:
          $ref: "#/components/schemas/State"
        createdAt:
          type: string
          format: date-time
        files:
          type: array
          items:
            type: string
          description: File names available under files/{name} once the export is done
        failure:
          $ref: "#/components/schemas/Failure"
      required:
        - id
        - projectId
        - analysisId
        - state
        - createdAt
    ToolsState:
      type: object
      description: Installed and available pnpm, uv and Trivy versions, and the DB date.
      properties:
        pnpmInstalled:
          type: array
          items:
            type: string
        uvInstalled:
          type: array
          description: The uv versions installed on the data volume, sorted
          items:
            type: string
        trivyActive:
          type: string
        trivyInstalled:
          type: array
          items:
            type: string
        trivyLatest:
          type: string
        trivyLatestAge:
          type: string
          description: Duration since the latest Trivy release, as a Go duration string
        trivyDbDate:
          type: string
          format: date-time
        latestSizeBytes:
          type: integer
          description: >
            Size in bytes of the latest Trivy release asset for this host,
            0 when the latest release is itself unavailable
        trivyRecommended:
          type: string
          description: >
            Newest Trivy release old enough to install without force, set
            only while the latest release is younger than the minimum
            release age
        ready:
          type: boolean
          description: Whether trivy and its database are both in place
        missing:
          type: array
          description: Names of what ready needs and does not have yet
          items:
            type: string
      required:
        - pnpmInstalled
        - trivyActive
        - trivyInstalled
        - trivyLatest
        - trivyLatestAge
        - trivyDbDate
        - latestSizeBytes
        - ready
        - missing
    EventKind:
      type: string
      description: Discriminator for the data payload of an Event.
      enum:
        - step
        - progress
        - candidate
        - log
        - end
    Event:
      type: object
      description: One server-sent event of the running job
      properties:
        kind:
          $ref: "#/components/schemas/EventKind"
        job:
          type: string
          description: Job ID the event belongs to
        storeId:
          type: string
          description: >-
            Store id (the directory id) of the job the event belongs to, set
            once the queue has started it. Empty for an event about a job
            cancelled before it started.
        data:
          description: Payload matching the kind; see StepData, ProgressData, CandidateData, LogData, EndData
          oneOf:
            - $ref: "#/components/schemas/StepData"
            - $ref: "#/components/schemas/ProgressData"
            - $ref: "#/components/schemas/CandidateData"
            - $ref: "#/components/schemas/LogData"
            - $ref: "#/components/schemas/EndData"
      required:
        - kind
        - job
        - data
    StepData:
      type: object
      description: Payload of a step event
      additionalProperties: false
      properties:
        name:
          type: string
        state:
          $ref: "#/components/schemas/State"
        durationMs:
          type: integer
        error:
          type: string
          description: err.Error() when state is failed, absent otherwise
      required:
        - name
        - state
    ProgressData:
      type: object
      description: Payload of a progress event
      additionalProperties: false
      properties:
        step:
          type: string
          description: >
            Name of the step this progress belongs to, matching a StepData
            "name" from the same run. A client keys progress by this field,
            not by how many step events it has seen so far: a subscriber
            that only replays the tail of a long run's history can still
            place this progress under the right step.
        done:
          type: integer
        total:
          type: integer
        estimatedRemainingMs:
          type: integer
        cacheHits:
          type: integer
          description: >
            Tarballs served from the tarball cache instead of downloaded, a
            running count. Only an export sends this; an analysis never
            does.
      required:
        - step
        - done
        - total
    CandidateData:
      type: object
      description: Payload of a candidate event
      additionalProperties: false
      properties:
        dependency:
          type: string
        version:
          type: string
        vector:
          type: array
          items:
            type: integer
          description: CVE counts by severity, critical to unknown
        signals:
          type: array
          items:
            type: string
      required:
        - dependency
        - version
        - vector
        - signals
    LogData:
      type: object
      description: Payload of a log event
      additionalProperties: false
      properties:
        line:
          type: string
      required:
        - line
    EndData:
      type: object
      description: Payload of the end event, always the last one of a job
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/State"
      required:
        - state
