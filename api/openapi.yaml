openapi: 3.1.0
info:
  title: sealift
  version: "1"
  description: >
    Scans a pnpm project for CVEs, ranks newer dependency versions, and
    builds an archive for an air-gapped Nexus import.
servers:
  - url: /api
tags:
  - name: projects
    description: Project creation, target and history
  - name: analyses
    description: Dependency scan and ranking jobs
  - name: exports
    description: Archive jobs and their files
  - name: jobs
    description: The running job's event stream
  - name: settings
    description: The settings the deployment set, the instance and its signing key
  - name: probes
    description: Readiness and liveness checks, served at the root
paths:
  /healthz:
    servers:
      - url: /
    get:
      operationId: getHealth
      tags:
        - probes
      summary: Readiness
      description: >-
        Answers 200 once every item of the preparation is ready, 503 with the
        names of the others until then. The causes are in GET /api/instance.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required:
                  - status
        "503":
          description: Still preparing
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: preparing
                  missing:
                    type: array
                    description: The items not ready yet.
                    items:
                      type: string
                required:
                  - status
                  - missing
  /livez:
    servers:
      - url: /
    get:
      operationId: getLive
      tags:
        - probes
      summary: Liveness
      description: >-
        Answers 200 while the process serves requests, preparing or not, so a
        liveness probe never restarts an instance that is still downloading.
      responses:
        "200":
          description: Live
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required:
                  - status
  /projects:
    get:
      operationId: listProjects
      tags:
        - projects
      summary: List projects with their last analysis and export
      parameters:
        - name: manifestSha256
          in: query
          required: false
          schema:
            type: string
          description: >
            Filter to the projects created from this exact manifest hash
            (sha256 of the uploaded bytes, lowercase hex), newest first
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProject
      tags:
        - projects
      summary: Create a project from an uploaded package.json or requirements files
      description: >-
        An npm project (the default) takes a manifest and a pip project
        takes one to 32 requirements parts and an optional pipTarget; either
        queues its first analysis. The request holds at most 40 parts. A
        requirements part above 1 MiB is refused, never cut.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                ecosystem:
                  $ref: "#/components/schemas/Ecosystem"
                name:
                  type: string
                  description: >-
                    Project name; an npm project defaults to the manifest name
                    field, a pip project requires it
                manifest:
                  type: string
                  format: binary
                  description: package.json content, required for an npm project
                requirements:
                  type: array
                  description: >-
                    Requirements files of a pip project, repeated. Each part's
                    filename is the file name.
                  items:
                    type: string
                    format: binary
                pipTarget:
                  type: string
                  description: >-
                    JSON of a PipTarget, at most 4 KiB, unknown fields refused.
                    The default target applies when absent.
      responses:
        "201":
          description: Project created, analysis queued for an npm project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags:
        - projects
      summary: Get a project, its target and its history
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteProject
      tags:
        - projects
      summary: Delete the project directory
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/target:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: setProjectTarget
      tags:
        - projects
      summary: Change the project's target platform and toolchain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Target"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: queueAnalysis
      tags:
        - analyses
      summary: Queue an analysis for the project
      responses:
        "202":
          description: Analysis queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses/{analysisId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AnalysisId"
    get:
      operationId: getAnalysis
      tags:
        - analyses
      summary: Get an analysis' status and results
      responses:
        "200":
          description: Analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAnalysis
      tags:
        - analyses
      summary: Delete an analysis
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/manifest:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectManifest
      tags:
        - projects
      summary: Get the package.json a project was created from, byte for byte
      responses:
        "200":
          description: The uploaded package.json
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses/{analysisId}/log:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AnalysisId"
    get:
      operationId: getAnalysisLog
      tags:
        - analyses
      summary: Get an analysis' full log
      responses:
        "200":
          description: Plain text log
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses/{analysisId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AnalysisId"
    post:
      operationId: cancelAnalysis
      tags:
        - analyses
      summary: Cancel a running or queued analysis
      responses:
        "200":
          description: Analysis after the cancel request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses/{analysisId}/exports:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AnalysisId"
    post:
      operationId: queueExport
      tags:
        - exports
      summary: Queue an export with a version selection
      description: >
        An npm export packs the selected versions and, with includeProject,
        the project tree. A pip export packs every wheel the analysis
        recorded: it takes an empty selection and ignores includeProject. A
        selection for a pip analysis answers 400. A pip analysis that lists
        no package, or a package with no wheel, answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          description: Export queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/exports/{exportId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExportId"
    get:
      operationId: getExport
      tags:
        - exports
      summary: Get an export's status and files
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteExport
      tags:
        - exports
      summary: Delete an export
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/exports/{exportId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExportId"
    post:
      operationId: cancelExport
      tags:
        - exports
      summary: Cancel a running or queued export
      responses:
        "200":
          description: Export after the cancel request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/exports/{exportId}/files/{name}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExportId"
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]+$'
        description: File name inside the export directory
    get:
      operationId: downloadExportFile
      tags:
        - exports
      summary: Download one file of a finished export
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /jobs/current/events:
    get:
      operationId: watchJob
      tags:
        - jobs
      summary: Server-sent events of the running job
      description: >
        Streams the five event kinds of the job queue: step, progress,
        candidate, log, end. Replays the running job's events so far, then
        streams live ones. The stream ends after the end event.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
        default:
          $ref: "#/components/responses/Problem"
  /settings:
    get:
      operationId: getSettings
      tags:
        - settings
      summary: Get settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"
  /instance:
    get:
      operationId: getInstance
      tags:
        - settings
      summary: How this instance was deployed and what it has prepared
      responses:
        "200":
          description: The deployment mode, the preparation, the policy, the brand and the tool versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        default:
          $ref: "#/components/responses/Problem"
  /instance/logo:
    get:
      operationId: getInstanceLogo
      tags:
        - settings
      summary: The logo the policy file names
      description: >-
        The bytes read at start, with their type. The headers keep a script in
        an SVG from running when this address is opened directly.
      responses:
        "200":
          description: The logo
          headers:
            Content-Security-Policy:
              required: true
              schema:
                type: string
                example: "default-src 'none'; style-src 'unsafe-inline'; sandbox"
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                example: nosniff
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /signing-key:
    get:
      operationId: getSigningKey
      tags:
        - settings
      summary: The public half of the key that signs exports
      responses:
        "200":
          description: The public key in PEM form and its public key sha256
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKey"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem type
          default: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type
        status:
          type: integer
          description: The HTTP status code repeated for clients that read the body only
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence
        instance:
          type: string
          format: uri
          description: A URI identifying this specific occurrence
        errors:
          type: array
          description: >-
            The offending entries of a validation failure, at most 100; the
            detail gives the total when there are more
          items:
            $ref: "#/components/schemas/ProblemDetail"
        missing:
          type: array
          description: Names of what a tools-missing problem needs and does not have yet
          items:
            type: string
      required:
        - title
        - status
    ProblemDetail:
      type: object
      description: One offending entry inside a validation failure's errors list
      properties:
        field:
          type: string
          description: >-
            package.json field, such as dependencies or pnpm.overrides, or the
            file name of a requirements problem
        line:
          type: integer
          description: Line of a requirements problem, absent for a problem of the whole file
        name:
          type: string
          description: Dependency name, empty for a field-level problem
        value:
          type: string
        reason:
          type: string
      required:
        - field
        - reason
    State:
      type: string
      description: State of a job and of the directory it writes
      enum:
        - queued
        - running
        - done
        - failed
        - cancelled
        - interrupted
    Target:
      type: object
      description: The system a resolution or an export is prepared for
      properties:
        os:
          type: string
          example: linux
        cpu:
          type: string
          example: x64
        libc:
          type: string
          example: glibc
        node:
          type: string
          example: 22.17.1
        pnpmVer:
          type: string
          example: 10.34.5
      required:
        - os
        - cpu
        - libc
        - node
        - pnpmVer
    Ecosystem:
      type: string
      description: The package manager a project belongs to
      enum:
        - npm
        - pip
    PipTarget:
      type: object
      description: The system a pip resolution is prepared for
      properties:
        python:
          type: string
          description: Python 3.<minor>.<patch>
          example: 3.11.2
        os:
          type: string
          example: linux
        cpu:
          type: string
          description: Only x86_64 for now
          example: x86_64
        glibc:
          type: string
          description: glibc 2.17 to 2.40
          example: "2.28"
        uvVer:
          type: string
          example: 0.13.7
      required:
        - python
        - os
        - cpu
        - glibc
        - uvVer
    Instance:
      type: object
      description: >-
        How this instance was deployed. In ephemeral mode, a project and the
        shared caches are erased when it is deleted, and every project is
        deleted once it has been idle for idleMinutes.
      properties:
        ephemeral:
          type: boolean
        idleMinutes:
          type: integer
          description: Present in ephemeral mode only.
        ready:
          type: boolean
          description: Whether every item of the preparation is ready.
        warning:
          type: string
          description: >-
            A database refresh that failed while an older database stays in
            use, with its cause.
        preparing:
          type: array
          description: Each item the start prepares, in order.
          items:
            $ref: "#/components/schemas/PreparingItem"
        brand:
          $ref: "#/components/schemas/Brand"
        policy:
          $ref: "#/components/schemas/Policy"
        tools:
          $ref: "#/components/schemas/InstanceTools"
      required:
        - ephemeral
        - ready
        - preparing
        - brand
        - policy
        - tools
    PreparingItem:
      type: object
      description: One thing an analysis needs, as the start prepares it.
      properties:
        name:
          type: string
          enum:
            - trivy
            - trivy-db
            - signing-key
            - pnpm
            - uv
        version:
          type: string
          description: >-
            The pinned Trivy, the database's date, the public key's sha256, or
            the pnpm or uv version.
        state:
          type: string
          enum:
            - preparing
            - ready
            - failed
          x-enum-varnames:
            - ItemPreparing
            - ItemReady
            - ItemFailed
        reason:
          type: string
          description: A failed item's cause.
        nextTry:
          type: string
          format: date-time
          description: A failed item's next attempt.
      required:
        - name
        - state
    Brand:
      type: object
      description: The name and the marks the interface shows.
      properties:
        name:
          type: string
          example: sealift
        online:
          type: string
          description: The label of the connected side.
          example: Online
        offline:
          type: string
          description: The label of the air-gapped side.
          example: Offline
        reviewWord:
          type: string
          description: The word for a reviewed request.
          example: PR
        logo:
          type: boolean
          description: Whether GET /instance/logo serves a logo.
        accent:
          type: string
          description: "A colour written #rrggbb. Absent for the default one."
          example: "#0b6e99"
        contact:
          $ref: "#/components/schemas/Contact"
      required:
        - name
        - online
        - offline
        - reviewWord
        - logo
    Contact:
      type: object
      description: Who the interface points a user to.
      properties:
        label:
          type: string
        url:
          type: string
          description: An https or mailto address.
      required:
        - label
        - url
    Policy:
      type: object
      description: The defaults and limits the deployment sets for every new project and analysis.
      properties:
        target:
          $ref: "#/components/schemas/Target"
        pipTarget:
          $ref: "#/components/schemas/PipTarget"
        minReleaseAgeDays:
          type: integer
        resolveParallelism:
          type: integer
        downloadParallelism:
          type: integer
        review:
          $ref: "#/components/schemas/ReviewPolicy"
      required:
        - target
        - pipTarget
        - minReleaseAgeDays
        - resolveParallelism
        - downloadParallelism
        - review
    ReviewPolicy:
      type: object
      description: What a selection needs before it can cross.
      properties:
        proposeOtherMajors:
          type: boolean
          description: Whether an analysis proposes versions outside the current line.
        majorJump:
          $ref: "#/components/schemas/ReviewRule"
        cveWithoutFix:
          $ref: "#/components/schemas/ReviewRule"
        yanked:
          $ref: "#/components/schemas/ReviewRule"
      required:
        - proposeOtherMajors
        - majorJump
        - cveWithoutFix
        - yanked
    ReviewRule:
      type: string
      description: reason lets the selection cross with a reason written for it; refuse stops it.
      enum:
        - reason
        - refuse
      x-enum-varnames:
        - RuleReason
        - RuleRefuse
    InstanceTools:
      type: object
      description: The tool versions on the data volume.
      properties:
        trivy:
          type: string
          description: The Trivy release this instance runs.
          example: 0.55.0
        trivyDbDate:
          type: string
          format: date-time
          description: Last update of the vulnerability database. Absent before the first one.
        pnpm:
          type: array
          description: The pnpm versions installed, sorted.
          items:
            type: string
        uv:
          type: array
          description: The uv versions installed, sorted.
          items:
            type: string
      required:
        - trivy
        - pnpm
        - uv
    Settings:
      type: object
      description: The values the deployment set, read only; the policy file changes them.
      properties:
        target:
          $ref: "#/components/schemas/Target"
        minReleaseAgeDays:
          type: integer
        resolveParallelism:
          type: integer
        downloadParallelism:
          type: integer
      required:
        - target
        - minReleaseAgeDays
        - resolveParallelism
        - downloadParallelism
    SigningKey:
      type: object
      description: The public half of the key that signs exports. The private half is never served.
      properties:
        publicKeyPem:
          type: string
          description: One PKIX PUBLIC KEY PEM block
        publicKeySha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Lowercase hex sha256 of the key's DER SubjectPublicKeyInfo
      required:
        - publicKeyPem
        - publicKeySha256
    ProjectSummary:
      type: object
      description: One row of the projects list.
      properties:
        id:
          type: string
        name:
          type: string
        ecosystem:
          $ref: "#/components/schemas/Ecosystem"
        target:
          $ref: "#/components/schemas/Target"
        pipTarget:
          $ref: "#/components/schemas/PipTarget"
        lastAnalysis:
          $ref: "#/components/schemas/Analysis"
        lastExport:
          $ref: "#/components/schemas/Export"
      required:
        - id
        - name
        - ecosystem
    Project:
      type: object
      description: >-
        A project, its target and its analysis and export history. An npm
        project has a target, a pip project has a pipTarget.
      properties:
        id:
          type: string
        name:
          type: string
        ecosystem:
          $ref: "#/components/schemas/Ecosystem"
        target:
          $ref: "#/components/schemas/Target"
        pipTarget:
          $ref: "#/components/schemas/PipTarget"
        manifestSha256:
          type: string
          description: sha256 of the uploaded package.json bytes, lowercase hex
        analyses:
          type: array
          items:
            $ref: "#/components/schemas/Analysis"
        exports:
          type: array
          items:
            $ref: "#/components/schemas/Export"
      required:
        - id
        - name
        - ecosystem
    Analysis:
      type: object
      description: One analysis job and its state.
      properties:
        id:
          type: string
        projectId:
          type: string
        state:
          $ref: "#/components/schemas/State"
        createdAt:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/AnalysisResult"
        trivyVersion:
          type: string
          description: Trivy version the analysis used, absent when it did not record one
        trivyDbDate:
          type: string
          format: date-time
          description: Vulnerability database date the analysis used, absent when it did not record one
        pnpmVersion:
          type: string
          description: pnpm version the analysis used, absent when it did not record one
        pipResult:
          $ref: "#/components/schemas/PipAnalysisResult"
        uvVersion:
          type: string
          description: uv version a pip analysis used, absent when it did not record one
        failure:
          $ref: "#/components/schemas/Failure"
      required:
        - id
        - projectId
        - state
        - createdAt
    Failure:
      type: object
      description: Which step failed and why
      properties:
        step:
          type: string
        message:
          type: string
      required:
        - step
        - message
    Vector:
      type: array
      description: CVE counts by severity, critical to unknown
      items:
        type: integer
      minItems: 5
      maxItems: 5
    Cve:
      type: object
      description: >-
        One vulnerability behind a Vector count, in one package. An id found in
        two packages appears once for each, and the vector counts it once.
      properties:
        id:
          type: string
          example: CVE-2024-29041
        severity:
          type: string
          description: As Trivy prints it, upper case
          example: HIGH
        package:
          type: string
          description: >-
            The package and version Trivy found it in, as name@version.
            Absent from an analysis written before it was kept.
          example: express@4.17.1
        fixedIn:
          type: string
          description: >-
            The versions Trivy names as fixing it, as Trivy prints them.
            Empty when none is known; absent from an analysis written before
            it was kept, whose fix is unknown.
          example: 4.19.2, 5.0.0
      required:
        - id
        - severity
    Signal:
      type: object
      description: One reason a candidate is blocked or worth a second look
      properties:
        name:
          type: string
        evidence:
          type: string
        blocking:
          type: boolean
      required:
        - name
        - evidence
        - blocking
    Candidate:
      type: object
      description: One newer version of a dependency, ranked against the current one
      properties:
        version:
          type: string
        vector:
          $ref: "#/components/schemas/Vector"
        cves:
          type: array
          description: The vulnerabilities behind vector, once per id and package, sorted by severity, id, then package
          items:
            $ref: "#/components/schemas/Cve"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        key:
          type: boolean
          description: Whether this candidate was resolved and scanned before the rest
        resolved:
          type: boolean
        published:
          type: string
          format: date-time
          description: Empty when the registry has no publication time
        leavesLine:
          type: boolean
          description: >-
            Whether this version leaves the line of the current one, the
            range npm's caret gives it. Set when the analysis is read.
      required:
        - version
        - vector
        - cves
        - signals
        - key
        - resolved
        - leavesLine
    DependencyResult:
      type: object
      description: One direct dependency's current CVEs and its ranked candidates
      properties:
        name:
          type: string
        current:
          type: string
        best:
          type: string
          description: >-
            Empty when no candidate inside the current line improves on the
            current version; the policy's review.proposeOtherMajors widens
            the search to every candidate
        vector:
          $ref: "#/components/schemas/Vector"
        cves:
          type: array
          description: The vulnerabilities behind vector, once per id and package, sorted by severity, id, then package
          items:
            $ref: "#/components/schemas/Cve"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        jump:
          type: string
          description: >-
            The first unblocked candidate outside the current line, in the
            order a proposal is taken. Absent when there is none, and in an
            analysis sealift 0.7.0 recorded, which did not write it.
        family:
          type: string
          description: >-
            The name of the family this dependency's jump belongs to. Absent
            when its jump moves alone.
      required:
        - name
        - current
        - vector
        - cves
        - candidates
    AnalysisResult:
      type: object
      description: What an analysis writes to candidates.json and ranking.json
      properties:
        target:
          $ref: "#/components/schemas/Target"
        before:
          $ref: "#/components/schemas/Vector"
        after:
          allOf:
            - $ref: "#/components/schemas/Vector"
          nullable: true
          x-omitempty: false
          description: Null when the combined check (step 9) never measured it
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencyResult"
        warnings:
          type: array
          items:
            type: string
        families:
          type: array
          description: >-
            The groups of dependencies whose jumps must move together, sorted
            by name. Absent from an analysis written before families existed.
          items:
            $ref: "#/components/schemas/Family"
        advisories:
          type: object
          description: >-
            What each CVE id that the result's cves lists name does, keyed by
            id, from the Trivy report. Absent from an analysis written before
            advisories were kept, and when no CVE has a title, a description
            or a date.
          propertyNames:
            type: string
            maxLength: 64
            pattern: "^[A-Z]+-[A-Za-z0-9-]+$"
          additionalProperties:
            $ref: "#/components/schemas/Advisory"
      required:
        - target
        - before
        - dependencies
        - warnings
    Advisory:
      type: object
      description: >-
        What one CVE does, as the Trivy report words it, cleaned and bounded.
        Each field is absent when the report does not give it.
      properties:
        title:
          type: string
          maxLength: 200
          description: >-
            Trivy's title, at most 200 code points. Plain text: a client
            renders it as text, never as HTML or Markdown.
          example: "axios: Axios DoS via lack of data size check"
        summary:
          type: string
          maxLength: 500
          description: >-
            The first paragraph of Trivy's description, at most 500 code
            points, cut after its last whole sentence. Plain text: a client
            renders it as text, never as HTML or Markdown.
        published:
          type: string
          format: date-time
          description: When the advisory was published, in UTC, to the second
    Family:
      type: object
      description: Dependencies whose jumps must move together
      properties:
        name:
          type: string
          description: The member the others name, and the line of its jump
          example: react 19
        members:
          type: array
          description: Sorted by name
          items:
            type: string
      required:
        - name
        - members
    PipAnalysisResult:
      type: object
      description: >-
        What a pip analysis writes to pip-result.json: the set resolved from
        the project's files, each package with its findings. A pip analysis
        proposes no other version. A done analysis may hold a package without
        a wheel and a non-empty blocking list, which no export takes. Every
        field an analysis from 0.7.0 lacks is absent from its answer, never
        read as empty or false.
      properties:
        target:
          $ref: "#/components/schemas/PipTarget"
        files:
          type: array
          description: Every requirements file the set was resolved from
          items:
            type: string
        packages:
          type: array
          description: The resolved set, sorted by normalized name
          items:
            $ref: "#/components/schemas/PipPackage"
        blocking:
          type: array
          description: >-
            Packages with no wheel the target can install. A done analysis
            lists each of them in packages too, without a wheel; a failed one
            lists no package.
          items:
            $ref: "#/components/schemas/PipBlocking"
        warnings:
          type: array
          items:
            type: string
        previous:
          $ref: "#/components/schemas/PipPreviousCrossing"
        removed:
          type: array
          description: >-
            Each package of the previous crossing that this set no longer
            holds, sorted by name. Absent with no previous crossing, and when
            no package left.
          items:
            $ref: "#/components/schemas/PipRemoved"
        advisories:
          type: object
          description: >-
            What each CVE id that the packages' cves lists name does, keyed
            by id, from the Trivy report. Absent from an analysis written
            before advisories were kept, and when no CVE has a title, a
            description or a date.
          propertyNames:
            type: string
            maxLength: 64
            pattern: "^[A-Z]+-[A-Za-z0-9-]+$"
          additionalProperties:
            $ref: "#/components/schemas/Advisory"
      required:
        - target
        - files
        - packages
        - blocking
        - warnings
    PipPackage:
      type: object
      description: One package of a pip analysis' set
      properties:
        name:
          type: string
          description: Normalized name
          example: jinja2
        version:
          type: string
          example: 3.1.2
        files:
          type: array
          description: The project files that pin it, empty for a transitive package
          items:
            type: string
        pinnedAt:
          type: array
          description: >-
            Each file and line that pins it, sorted by file then line. A
            requirement line that repeats the one before it in this order,
            with the same version, marker and extras, counts once; only the
            first constraint line of a package counts, and none of a required
            package. Absent for a transitive package and from an analysis
            written before places were recorded.
          items:
            $ref: "#/components/schemas/PipPlace"
        wheel:
          $ref: "#/components/schemas/PipWheel"
        cves:
          type: array
          description: Sorted by severity, then id
          items:
            $ref: "#/components/schemas/PipFinding"
        yanked:
          $ref: "#/components/schemas/PipYanked"
        previous:
          $ref: "#/components/schemas/PipPrevious"
      required:
        - name
        - version
        - files
        - cves
    PipPlace:
      type: object
      description: A line of a requirements file that pins a package
      properties:
        file:
          type: string
          example: requirements.txt
        line:
          type: integer
          description: 1 for the first line
          example: 3
      required:
        - file
        - line
    PipYanked:
      type: object
      description: >-
        The chosen file is yanked on the index: its publisher withdrew it.
        Absent when the index keeps the release, and from an analysis written
        before the mark was recorded, whose warnings may name the release
        instead.
      properties:
        reason:
          type: string
          maxLength: 200
          description: >-
            The index's reason, plain text that a client renders as text.
            Kept to printable characters and cut to 200 code points. Empty
            when the index gives none.
      required:
        - reason
    PipPrevious:
      type: object
      description: >-
        The package as the previous crossing held it. Absent for a package
        new since then, and when the analysis records no previous crossing.
      properties:
        version:
          type: string
          example: 3.1.2
        cves:
          type: array
          description: >-
            Its findings at that version, from this analysis's own scan,
            sorted by severity, then id
          items:
            $ref: "#/components/schemas/PipFinding"
        majorJump:
          type: boolean
          description: >-
            The first release segment, epoch first, differs between that
            version and this one. A segment of 1000 or more, as in a calendar
            version, never counts.
      required:
        - version
        - cves
        - majorJump
    PipPreviousCrossing:
      type: object
      description: >-
        The latest done export, created before this analysis started, of a
        pip project with the same name, trimmed and compared without case,
        this project included. Absent when there is none, when it could not
        be read, and from an analysis written before crossings were compared.
      properties:
        projectId:
          type: string
        projectName:
          type: string
        exportId:
          type: string
        analysisId:
          type: string
        sealedAt:
          type: string
          format: date-time
          description: When that export was created
      required:
        - projectId
        - projectName
        - exportId
        - analysisId
        - sealedAt
    PipRemoved:
      type: object
      description: A package of the previous crossing that the set no longer holds
      properties:
        name:
          type: string
        version:
          type: string
          description: Its version in the previous crossing
        cves:
          type: array
          description: >-
            Its findings at that version, from this analysis's own scan,
            sorted by severity, then id
          items:
            $ref: "#/components/schemas/PipFinding"
      required:
        - name
        - version
        - cves
    PipWheel:
      type: object
      description: >-
        The wheel chosen for a package, as the index lists it. A package of a
        done analysis may have none: its blocking entry says why, and no
        export takes the set.
      properties:
        file:
          type: string
        url:
          type: string
        sha256:
          type: string
          description: Lowercase hex
        size:
          type: integer
          format: int64
          description: Bytes
        uploadedAt:
          type: string
          format: date-time
          description: >-
            When the index says the file was uploaded, in UTC. Absent when the
            index gives none, and from an analysis written before upload times
            were recorded.
      required:
        - file
        - url
        - sha256
        - size
    PipFinding:
      type: object
      description: One known vulnerability of a pip package
      properties:
        id:
          type: string
          example: CVE-2024-22195
        severity:
          type: string
          description: As Trivy prints it, upper case
          example: MEDIUM
        fixedVersions:
          type: array
          description: The versions that fix it, as Trivy lists them, empty when none is known
          items:
            type: string
        title:
          type: string
          description: >-
            Trivy's title, plain text that a client renders as text, never as
            HTML or Markdown. A newer analysis stores it cleaned and cut to 200
            code points. An analysis from 0.7.0 stores it as Trivy gave it.
      required:
        - id
        - severity
        - fixedVersions
    PipBlocking:
      type: object
      description: >-
        A package the target cannot install from a wheel. A done analysis may
        hold one: the package stays in its set without a wheel, and no export
        takes the set.
      properties:
        name:
          type: string
        version:
          type: string
        kind:
          type: string
          enum:
            - source-only
            - other-platforms
            - no-files
            - hash-mismatch
        detail:
          type: string
        pinnedAt:
          type: array
          description: >-
            Each file and line that pins it, sorted by file then line. A
            requirement line that repeats the one before it in this order,
            with the same version, marker and extras, counts once; only the
            first constraint line of a package counts, and none of a required
            package. Absent for a transitive package and from an analysis
            written before places were recorded.
          items:
            $ref: "#/components/schemas/PipPlace"
      required:
        - name
        - version
        - kind
        - detail
    ExportRequest:
      type: object
      description: >
        A selection of versions per dependency, plus the project tree flag.
        A pip export takes an empty selection and the reasons its set
        needs, and ignores the flag.
      properties:
        selection:
          type: object
          description: >
            Dependency name to the list of its versions to include. An
            empty or absent list selects nothing for that dependency. A pip
            export carries the analysis's whole set, so its selection is
            empty. At most 10,000 dependencies, each name at most 214
            bytes; a request past either bound is refused with 400. Every
            JSON request body is read within 16 MiB; a larger one is
            refused with 413, and a body of another type with 415.
          maxProperties: 10000
          propertyNames:
            maxLength: 214
          additionalProperties:
            type: array
            items:
              type: string
        includeProject:
          type: boolean
          default: false
          description: Add the current project tree to an npm export. A pip export ignores it.
        reasons:
          type: array
          description: >
            The reasons the selection needs: one for each family or lone
            dependency it takes out of its line, and one for each dependency
            whose kept version carries a CVE that no version fixes. A pip
            export needs one reason per package for each major jump since
            the previous crossing, each CVE that no version fixes and each
            yanked release, and refuses a reason that is missing, repeated
            or covers nothing. The signed manifest carries them in its
            review. At most 10,000.
          maxItems: 10000
          items:
            $ref: "#/components/schemas/Reason"
      required:
        - selection
    Reason:
      type: object
      description: >
        Why a selection takes a jump, keeps a CVE that no version fixes, or
        carries a yanked release. `yanked` is for a pip export only: an npm
        export refuses it.
      properties:
        kind:
          type: string
          enum:
            - major-jump
            - cve-without-fix
            - yanked
        dependencies:
          type: array
          minItems: 1
          maxItems: 10000
          description: >
            The dependencies the reason covers, by name, each at most 214
            bytes. A pip reason names one package.
          items:
            type: string
            maxLength: 214
        text:
          type: string
          maxLength: 1200
          description: >
            1 to 300 characters once trimmed, on one line, with no control,
            line-separating, bidirectional or other format character.
      required:
        - kind
        - dependencies
        - text
    Export:
      type: object
      description: One export job, its state and its files.
      properties:
        id:
          type: string
        projectId:
          type: string
        analysisId:
          type: string
        state:
          $ref: "#/components/schemas/State"
        createdAt:
          type: string
          format: date-time
        files:
          type: array
          items:
            type: string
          description: File names available under files/{name} once the export is done
        failure:
          $ref: "#/components/schemas/Failure"
      required:
        - id
        - projectId
        - analysisId
        - state
        - createdAt
    EventKind:
      type: string
      description: Discriminator for the data payload of an Event.
      enum:
        - step
        - progress
        - candidate
        - log
        - end
    Event:
      type: object
      description: One server-sent event of the running job
      properties:
        kind:
          $ref: "#/components/schemas/EventKind"
        job:
          type: string
          description: Job ID the event belongs to
        storeId:
          type: string
          description: >-
            Store id (the directory id) of the job the event belongs to, set
            once the queue has started it. Empty for an event about a job
            cancelled before it started.
        data:
          description: Payload matching the kind; see StepData, ProgressData, CandidateData, LogData, EndData
          oneOf:
            - $ref: "#/components/schemas/StepData"
            - $ref: "#/components/schemas/ProgressData"
            - $ref: "#/components/schemas/CandidateData"
            - $ref: "#/components/schemas/LogData"
            - $ref: "#/components/schemas/EndData"
      required:
        - kind
        - job
        - data
    StepData:
      type: object
      description: Payload of a step event
      additionalProperties: false
      properties:
        name:
          type: string
        state:
          $ref: "#/components/schemas/State"
        durationMs:
          type: integer
        error:
          type: string
          description: err.Error() when state is failed, absent otherwise
      required:
        - name
        - state
    ProgressData:
      type: object
      description: Payload of a progress event
      additionalProperties: false
      properties:
        step:
          type: string
          description: >
            Name of the step this progress belongs to, matching a StepData
            "name" from the same run. A client keys progress by this field,
            not by how many step events it has seen so far: a subscriber
            that only replays the tail of a long run's history can still
            place this progress under the right step.
        done:
          type: integer
        total:
          type: integer
        estimatedRemainingMs:
          type: integer
        cacheHits:
          type: integer
          description: >
            Tarballs served from the tarball cache instead of downloaded, a
            running count. Only an export sends this; an analysis never
            does.
      required:
        - step
        - done
        - total
    CandidateData:
      type: object
      description: Payload of a candidate event
      additionalProperties: false
      properties:
        dependency:
          type: string
        version:
          type: string
        vector:
          type: array
          items:
            type: integer
          description: CVE counts by severity, critical to unknown
        signals:
          type: array
          items:
            type: string
      required:
        - dependency
        - version
        - vector
        - signals
    LogData:
      type: object
      description: Payload of a log event
      additionalProperties: false
      properties:
        line:
          type: string
      required:
        - line
    EndData:
      type: object
      description: Payload of the end event, always the last one of a job
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/State"
      required:
        - state
