openapi: 3.1.0
info:
  title: sealift
  version: "1"
  description: >
    Scans a pnpm project for CVEs, ranks newer dependency versions, and
    builds an archive for an air-gapped Nexus import.
servers:
  - url: /api
tags:
  - name: projects
    description: Project creation, target and history
  - name: analyses
    description: Dependency scan and ranking jobs
  - name: exports
    description: Archive jobs and their files
  - name: jobs
    description: The running job's event stream
  - name: settings
    description: User-configurable defaults
  - name: tools
    description: pnpm and Trivy installs and updates
paths:
  /projects:
    get:
      operationId: listProjects
      tags:
        - projects
      summary: List projects with their last analysis and export
      parameters:
        - name: manifestSha256
          in: query
          required: false
          schema:
            type: string
          description: >
            Filter to the projects created from this exact manifest hash
            (sha256 of the uploaded bytes, lowercase hex), newest first
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProject
      tags:
        - projects
      summary: Create a project from an uploaded package.json and start an analysis
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - manifest
              properties:
                name:
                  type: string
                  description: Project name; defaults to the manifest name field
                manifest:
                  type: string
                  format: binary
                  description: package.json content
      responses:
        "201":
          description: Project created, analysis queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags:
        - projects
      summary: Get a project, its target and its history
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteProject
      tags:
        - projects
      summary: Delete the project directory
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/target:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: setProjectTarget
      tags:
        - projects
      summary: Change the project's target platform and toolchain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Target"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: queueAnalysis
      tags:
        - analyses
      summary: Queue an analysis for the project
      responses:
        "202":
          description: Analysis queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses/{analysisId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AnalysisId"
    get:
      operationId: getAnalysis
      tags:
        - analyses
      summary: Get an analysis' status and results
      responses:
        "200":
          description: Analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAnalysis
      tags:
        - analyses
      summary: Delete an analysis
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses/{analysisId}/log:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AnalysisId"
    get:
      operationId: getAnalysisLog
      tags:
        - analyses
      summary: Get an analysis' full log
      responses:
        "200":
          description: Plain text log
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses/{analysisId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AnalysisId"
    post:
      operationId: cancelAnalysis
      tags:
        - analyses
      summary: Cancel a running or queued analysis
      responses:
        "200":
          description: Analysis after the cancel request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/analyses/{analysisId}/exports:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AnalysisId"
    post:
      operationId: queueExport
      tags:
        - exports
      summary: Queue an export with a version selection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          description: Export queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/exports/{exportId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExportId"
    get:
      operationId: getExport
      tags:
        - exports
      summary: Get an export's status and files
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteExport
      tags:
        - exports
      summary: Delete an export
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/exports/{exportId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExportId"
    post:
      operationId: cancelExport
      tags:
        - exports
      summary: Cancel a running or queued export
      responses:
        "200":
          description: Export after the cancel request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/exports/{exportId}/files/{name}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExportId"
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]+$'
        description: File name inside the export directory
    get:
      operationId: downloadExportFile
      tags:
        - exports
      summary: Download one file of a finished export
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /jobs/current/events:
    get:
      operationId: watchJob
      tags:
        - jobs
      summary: Server-sent events of the running job
      description: >
        Streams the five event kinds of the job queue: step, progress,
        candidate, log, end. Replays the running job's events so far, then
        streams live ones. The stream ends after the end event.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
        default:
          $ref: "#/components/responses/Problem"
  /settings:
    get:
      operationId: getSettings
      tags:
        - settings
      summary: Get settings, with signatureKey masked
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateSettings
      tags:
        - settings
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Updated settings, with signatureKey masked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"
  /tools:
    get:
      operationId: getTools
      tags:
        - tools
      summary: Installed and available tool versions, DB date
      responses:
        "200":
          description: Tools state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsState"
        default:
          $ref: "#/components/responses/Problem"
  /tools/trivy/update:
    post:
      operationId: updateTrivy
      tags:
        - tools
      summary: Install a new Trivy release
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - force
              properties:
                force:
                  type: boolean
                  description: Install the latest release regardless of its age
      responses:
        "200":
          description: Tools state after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsState"
        default:
          $ref: "#/components/responses/Problem"
  /tools/trivy/activate:
    post:
      operationId: activateTrivy
      tags:
        - tools
      summary: Activate an installed Trivy version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              properties:
                version:
                  type: string
      responses:
        "200":
          description: Tools state after the activation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsState"
        default:
          $ref: "#/components/responses/Problem"
  /tools/trivy/db/update:
    post:
      operationId: updateTrivyDB
      tags:
        - tools
      summary: Force a Trivy DB download
      responses:
        "200":
          description: Tools state after the DB update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsState"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem type
          default: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type
        status:
          type: integer
          description: The HTTP status code repeated for clients that read the body only
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence
        instance:
          type: string
          format: uri
          description: A URI identifying this specific occurrence
        errors:
          type: array
          description: Every offending entry, for a validation failure
          items:
            $ref: "#/components/schemas/ProblemDetail"
        missing:
          type: array
          description: Names of what a tools-missing problem needs and does not have yet
          items:
            type: string
      required:
        - title
        - status
    ProblemDetail:
      type: object
      description: One offending entry inside a validation failure's errors list
      properties:
        field:
          type: string
          description: package.json field, such as dependencies or pnpm.overrides
        name:
          type: string
          description: Dependency name, empty for a field-level problem
        value:
          type: string
        reason:
          type: string
      required:
        - field
        - reason
    State:
      type: string
      description: State of a job and of the directory it writes
      enum:
        - queued
        - running
        - done
        - failed
        - cancelled
        - interrupted
    Target:
      type: object
      description: The system a resolution or an export is prepared for
      properties:
        os:
          type: string
          example: linux
        cpu:
          type: string
          example: x64
        libc:
          type: string
          example: glibc
        node:
          type: string
          example: 22.17.1
        pnpmVer:
          type: string
          example: 10.34.5
      required:
        - os
        - cpu
        - libc
        - node
        - pnpmVer
    Settings:
      type: object
      description: Every value the interface can change.
      properties:
        target:
          $ref: "#/components/schemas/Target"
        signatureKey:
          type: string
          description: Masked on read, never logged
        minReleaseAgeDays:
          type: integer
        resolveParallelism:
          type: integer
        downloadParallelism:
          type: integer
      required:
        - target
        - signatureKey
        - minReleaseAgeDays
        - resolveParallelism
        - downloadParallelism
    ProjectSummary:
      type: object
      description: One row of the projects list.
      properties:
        id:
          type: string
        name:
          type: string
        target:
          $ref: "#/components/schemas/Target"
        lastAnalysis:
          $ref: "#/components/schemas/Analysis"
        lastExport:
          $ref: "#/components/schemas/Export"
      required:
        - id
        - name
        - target
    Project:
      type: object
      description: A project, its target and its analysis and export history.
      properties:
        id:
          type: string
        name:
          type: string
        target:
          $ref: "#/components/schemas/Target"
        manifestSha256:
          type: string
          description: sha256 of the uploaded package.json bytes, lowercase hex
        analyses:
          type: array
          items:
            $ref: "#/components/schemas/Analysis"
        exports:
          type: array
          items:
            $ref: "#/components/schemas/Export"
      required:
        - id
        - name
        - target
    Analysis:
      type: object
      description: One analysis job and its state.
      properties:
        id:
          type: string
        projectId:
          type: string
        state:
          $ref: "#/components/schemas/State"
        createdAt:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/AnalysisResult"
        trivyVersion:
          type: string
          description: Trivy version the analysis used, absent when it did not record one
        trivyDbDate:
          type: string
          format: date-time
          description: Vulnerability database date the analysis used, absent when it did not record one
        pnpmVersion:
          type: string
          description: pnpm version the analysis used, absent when it did not record one
        failure:
          $ref: "#/components/schemas/Failure"
      required:
        - id
        - projectId
        - state
        - createdAt
    Failure:
      type: object
      description: Which step failed and why
      properties:
        step:
          type: string
        message:
          type: string
      required:
        - step
        - message
    Vector:
      type: array
      description: CVE counts by severity, critical to unknown
      items:
        type: integer
      minItems: 5
      maxItems: 5
    Cve:
      type: object
      description: One vulnerability behind a Vector count
      properties:
        id:
          type: string
          example: CVE-2024-29041
        severity:
          type: string
          description: As Trivy prints it, upper case
          example: HIGH
      required:
        - id
        - severity
    Signal:
      type: object
      description: One reason a candidate is blocked or worth a second look
      properties:
        name:
          type: string
        evidence:
          type: string
        blocking:
          type: boolean
      required:
        - name
        - evidence
        - blocking
    Candidate:
      type: object
      description: One newer version of a dependency, ranked against the current one
      properties:
        version:
          type: string
        vector:
          $ref: "#/components/schemas/Vector"
        cves:
          type: array
          description: The vulnerabilities behind vector, sorted by severity then id
          items:
            $ref: "#/components/schemas/Cve"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        key:
          type: boolean
          description: Whether this candidate was resolved and scanned before the rest
        resolved:
          type: boolean
        published:
          type: string
          format: date-time
          description: Empty when the registry has no publication time
      required:
        - version
        - vector
        - cves
        - signals
        - key
        - resolved
    DependencyResult:
      type: object
      description: One direct dependency's current CVEs and its ranked candidates
      properties:
        name:
          type: string
        current:
          type: string
        best:
          type: string
          description: Empty when no candidate improves on the current version
        vector:
          $ref: "#/components/schemas/Vector"
        cves:
          type: array
          description: The vulnerabilities behind vector, sorted by severity then id
          items:
            $ref: "#/components/schemas/Cve"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
      required:
        - name
        - current
        - vector
        - cves
        - candidates
    AnalysisResult:
      type: object
      description: What an analysis writes to candidates.json and ranking.json
      properties:
        target:
          $ref: "#/components/schemas/Target"
        before:
          $ref: "#/components/schemas/Vector"
        after:
          allOf:
            - $ref: "#/components/schemas/Vector"
          nullable: true
          x-omitempty: false
          description: Null when the combined check (step 9) never measured it
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencyResult"
        warnings:
          type: array
          items:
            type: string
      required:
        - target
        - before
        - dependencies
        - warnings
    ExportRequest:
      type: object
      description: A selection of versions per dependency, plus the project tree flag
      properties:
        selection:
          type: object
          description: >
            Dependency name to the list of its versions to include. An
            empty or absent list selects nothing for that dependency.
          additionalProperties:
            type: array
            items:
              type: string
        includeProject:
          type: boolean
          default: false
          description: Add the current project tree to the export
      required:
        - selection
    Export:
      type: object
      description: One export job, its state and its files.
      properties:
        id:
          type: string
        projectId:
          type: string
        analysisId:
          type: string
        state:
          $ref: "#/components/schemas/State"
        createdAt:
          type: string
          format: date-time
        files:
          type: array
          items:
            type: string
          description: File names available under files/{name} once the export is done
        failure:
          $ref: "#/components/schemas/Failure"
      required:
        - id
        - projectId
        - analysisId
        - state
        - createdAt
    ToolsState:
      type: object
      description: Installed and available pnpm and Trivy versions, and the DB date.
      properties:
        pnpmInstalled:
          type: array
          items:
            type: string
        trivyActive:
          type: string
        trivyInstalled:
          type: array
          items:
            type: string
        trivyLatest:
          type: string
        trivyLatestAge:
          type: string
          description: Duration since the latest Trivy release, as a Go duration string
        trivyDbDate:
          type: string
          format: date-time
        latestSizeBytes:
          type: integer
          description: >
            Size in bytes of the latest Trivy release asset for this host,
            0 when the latest release is itself unavailable
        ready:
          type: boolean
          description: Whether trivy, its database and a signature key are all in place
        missing:
          type: array
          description: Names of what ready needs and does not have yet
          items:
            type: string
      required:
        - pnpmInstalled
        - trivyActive
        - trivyInstalled
        - trivyLatest
        - trivyLatestAge
        - trivyDbDate
        - latestSizeBytes
        - ready
        - missing
    EventKind:
      type: string
      description: Discriminator for the data payload of an Event.
      enum:
        - step
        - progress
        - candidate
        - log
        - end
    Event:
      type: object
      description: One server-sent event of the running job
      properties:
        kind:
          $ref: "#/components/schemas/EventKind"
        job:
          type: string
          description: Job ID the event belongs to
        storeId:
          type: string
          description: >-
            Store id (the directory id) of the job the event belongs to, set
            once the queue has started it. Empty for an event about a job
            cancelled before it started.
        data:
          description: Payload matching the kind; see StepData, ProgressData, CandidateData, LogData, EndData
          oneOf:
            - $ref: "#/components/schemas/StepData"
            - $ref: "#/components/schemas/ProgressData"
            - $ref: "#/components/schemas/CandidateData"
            - $ref: "#/components/schemas/LogData"
            - $ref: "#/components/schemas/EndData"
      required:
        - kind
        - job
        - data
    StepData:
      type: object
      description: Payload of a step event
      additionalProperties: false
      properties:
        name:
          type: string
        state:
          $ref: "#/components/schemas/State"
        durationMs:
          type: integer
        error:
          type: string
          description: err.Error() when state is failed, absent otherwise
      required:
        - name
        - state
    ProgressData:
      type: object
      description: Payload of a progress event
      additionalProperties: false
      properties:
        done:
          type: integer
        total:
          type: integer
        estimatedRemainingMs:
          type: integer
        cacheHits:
          type: integer
          description: >
            Tarballs served from the tarball cache instead of downloaded, a
            running count. Only an export sends this; an analysis never
            does.
      required:
        - done
        - total
    CandidateData:
      type: object
      description: Payload of a candidate event
      additionalProperties: false
      properties:
        dependency:
          type: string
        version:
          type: string
        vector:
          type: array
          items:
            type: integer
          description: CVE counts by severity, critical to unknown
        signals:
          type: array
          items:
            type: string
      required:
        - dependency
        - version
        - vector
        - signals
    LogData:
      type: object
      description: Payload of a log event
      additionalProperties: false
      properties:
        line:
          type: string
      required:
        - line
    EndData:
      type: object
      description: Payload of the end event, always the last one of a job
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/State"
      required:
        - state
