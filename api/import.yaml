openapi: 3.1.0
info:
  title: sealift import service
  version: "1"
  description: >
    Tells a signed-in user who the service acts for, lists the archives in
    the user's MinIO folder, and starts and follows imports. Every operation
    needs the access token the gateway forwards in the header the settings
    name in token.header, X-Access-Token by default.
servers:
  - url: /api
tags:
  - name: session
    description: The signed-in user
  - name: archives
    description: The archives in the user's MinIO folders
  - name: imports
    description: Imports of those archives into Nexus
paths:
  /me:
    get:
      operationId: getMe
      tags:
        - session
      summary: Name the user the checked token stands for
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /archives:
    get:
      operationId: listArchives
      tags:
        - archives
      summary: List the archives in the user's folder
      description: >
        Lists the objects under packages/npm/ in the bucket user-<name> and
        pairs each archive with the manifest.json of its own folder. Reads no
        manifest. 502 when MinIO cannot be reached or refuses the call.
      responses:
        "200":
          description: The archives, none when MinIO is not configured or the bucket does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveList"
        default:
          $ref: "#/components/responses/Problem"
  /imports:
    get:
      operationId: listImports
      tags:
        - imports
      summary: List the user's imports, newest first
      responses:
        "200":
          description: The imports of the checked user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: startImport
      tags:
        - imports
      summary: Queue an import of one archive in the user's folder
      description: >
        Imports run one at a time across all users, in the order they were
        started. The key must name an importable archive in the user's own
        folder; any other key answers 404 without a MinIO request. A request
        with a foreign Origin, Sec-Fetch-Site cross-site or a body that is not
        application/json answers 403 and changes nothing. 409 when the same
        objects (key and ETag of the archive and of its manifest) already have an
        import that is queued, running, incomplete or interrupted; the body
        names that import. A complete or a refused import does not block a new
        start: a refused latest attempt published and removed nothing, so a
        mistyped expectedSha256 is corrected by starting again. An earlier
        attempt of the same import may have published packages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartImport"
      responses:
        "202":
          description: The import, queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        "409":
          description: The archive already has an import that is queued, running, incomplete, interrupted or cancelled, or MinIO is not configured
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ImportConflict"
        default:
          $ref: "#/components/responses/Problem"
  /imports/{importId}:
    get:
      operationId: getImport
      tags:
        - imports
      summary: Read one import
      description: Another user's id answers 404 like a missing one.
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        default:
          $ref: "#/components/responses/Problem"
  /imports/{importId}/retry:
    post:
      operationId: retryImport
      tags:
        - imports
      summary: Add an attempt to an import
      description: >
        Queues a new attempt that reads the archive and the manifest again,
        checks them again and reads every package from Nexus again. With no
        packages it may upload any package, and nothing carries over from an
        earlier attempt. With packages it uploads only those files; every other
        package is read from Nexus and never uploaded, and one Nexus lacks
        stays failed with the kind and reason the latest attempt recorded.
        Accepted whatever the last outcome was, while no attempt is queued or
        running and the archive is still in MinIO. 409 otherwise. 400 when
        packages names anything but failed packages of the latest attempt, or
        one twice; the answer repeats none of them and nothing changes. The
        attempt ends refused, publishing nothing, when the archive or the
        manifest changed in MinIO since the import was created. Another user's
        id answers 404 like a missing one. The guard against cross-site
        requests is the one of startImport.
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryImport"
      responses:
        "202":
          description: The import, with its new attempt queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        "409":
          description: An attempt is queued or running, the archive is no longer in MinIO, or MinIO is not configured
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ImportConflict"
        default:
          $ref: "#/components/responses/Problem"
  /imports/{importId}/cancel:
    post:
      operationId: cancelImport
      tags:
        - imports
      summary: Cancel the latest attempt of an import
      description: >
        A queued attempt leaves the queue and ends cancelled at once. A running
        attempt stops before its next package and ends cancelled; its packages
        not reached fail with the kind interrupted. Every package already in
        Nexus stays there, and a cancelled attempt removes nothing from MinIO.
        An attempt that ended every package before the cancel keeps the outcome
        it ends with. A cancelled import takes a retry and blocks a new start
        of its archive like an incomplete one. 409 once the latest attempt has
        ended. Another user's id answers 404 like a missing one. The guard
        against cross-site requests is the one of startImport.
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: An empty object
      responses:
        "202":
          description: The import, its latest attempt cancelled or stopping before its next package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        "409":
          description: The latest attempt has ended
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ImportConflict"
        default:
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: >
        Error. 401 when the token fails a check (the detail names the check),
        403 when its preferred_username cannot name a user folder or a start,
        a retry or a cancel looks cross-site, 404 for an unknown import or an archive outside the
        user's folder, 413 for a body over 64 KiB, 502 when MinIO fails, 503
        when the realm's keys cannot be had or the service is stopping.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Me:
      type: object
      properties:
        user:
          type: string
          description: The checked token's preferred_username, which names the user's bucket and folder
        minioConfigured:
          type: boolean
          description: Whether the settings file has a minio section
        bucket:
          type: string
          description: The user's MinIO bucket, user-<name>, named whether or not the settings file has a minio section
        folder:
          type: string
          description: The npm folder, packages/npm/, kept for clients that read one folder; the service lists, reads and deletes in packages/npm/ and packages/pip/
        publicKeySha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The sha256 of the public key every archive's signature must verify with, as the settings file names it
      required:
        - user
        - minioConfigured
        - bucket
        - folder
        - publicKeySha256
    ArchiveList:
      type: object
      properties:
        minioConfigured:
          type: boolean
        bucket:
          type: string
          description: The user's bucket, user-<name>
        folder:
          type: string
          description: The npm folder, packages/npm/, kept for clients that read one folder
        folders:
          type: array
          description: The folders the list covers, npm first, packages/npm/ then packages/pip/
          items:
            type: string
        bucketMissing:
          type: boolean
          description: True when MinIO has no bucket for the user
        message:
          type: string
          description: >
            Says what an empty list means when the bucket is missing, or names
            the folder MinIO could not list, with MinIO's reason, while the
            other folder is listed
        truncated:
          type: boolean
          description: True when a folder holds more objects than the list read
        unencrypted:
          type: array
          description: The links that run over plain http, among keySet, minio and nexus
          items:
            type: string
        archives:
          type: array
          items:
            $ref: "#/components/schemas/Archive"
      required:
        - minioConfigured
        - bucket
        - folder
        - bucketMissing
        - truncated
        - unencrypted
        - archives
    Archive:
      type: object
      properties:
        key:
          type: string
          description: The object key, under packages/npm/ or packages/pip/
        ecosystem:
          $ref: "#/components/schemas/Ecosystem"
        size:
          type: integer
          format: int64
        modified:
          type: string
          format: date-time
        importable:
          type: boolean
        reason:
          type: string
          description: Why the archive cannot be imported; absent when it can
        latestImport:
          $ref: "#/components/schemas/LatestImport"
        crossing:
          $ref: "#/components/schemas/Crossing"
        signature:
          type: string
          enum:
            - verified
            - unsigned
            - unknown-key
            - mismatch
            - unreadable
            - not-checked
          description: >
            What the list found when it checked the manifest's signature
            against the trusted key: verified, unsigned (no manifest.json.sig
            in the folder), unknown-key (manifest.json.sig names another key),
            mismatch (the signature does not match the manifest), unreadable
            (manifest.json or manifest.json.sig cannot be read), or
            not-checked (this list read neither, as when its read bound is
            reached; a later list checks it). Absent from an archive listed by
            sealift 0.7.0 or earlier.
        signerKeySha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >
            The key sha256 that manifest.json.sig names, on an unknown-key
            archive only, and only when it is 64 lowercase hex digits. It is
            never trusted. Absent from an archive listed by sealift 0.7.0 or
            earlier.
        declaredSize:
          type: integer
          format: int64
          description: >
            The archive's size as its signed manifest states it, once the
            signature verifies. Absent otherwise, and from an archive listed
            by sealift 0.7.0 or earlier.
        files:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveFile"
          description: >
            The archive, manifest.json and manifest.json.sig of the archive's
            folder as MinIO lists them, in that order, each when present.
            Absent from an archive listed by sealift 0.7.0 or earlier.
      required:
        - key
        - size
        - modified
        - importable
    ArchiveFile:
      type: object
      description: A file of an archive's folder as MinIO lists it
      properties:
        name:
          type: string
          description: The file's name in its folder
        size:
          type: integer
          format: int64
        modified:
          type: string
          format: date-time
          description: When MinIO received the file
      required:
        - name
        - size
        - modified
    Crossing:
      type: object
      description: >
        The crossing an archive comes from, read from its manifest once the
        signature verifies with the trusted key, and never before.
      properties:
        project:
          type: string
          description: >
            The project's name the manifest's review signs. Absent when the
            manifest carries no review or no readable name, as a manifest of
            sealift 0.7.0 or earlier.
        sealedAt:
          type: string
          description: The manifest's createdAt, an RFC 3339 time
        packages:
          type: integer
          description: How many packages the manifest lists
        review:
          $ref: "#/components/schemas/CrossingReview"
      required:
        - sealedAt
        - packages
    CrossingReview:
      type: object
      description: >
        The figures of the review the signed manifest carries. Absent on an
        archive's crossing, and from a report whose manifest has no review.
      properties:
        updated:
          type: integer
          description: The packages the review updates, those of its major jumps included
        cvesBefore:
          type: array
          items:
            type: integer
          description: The known CVEs before the update, by severity, critical first
        cvesAfter:
          type: array
          items:
            type: integer
          description: The known CVEs after the update, by severity; absent when they were not checked together
        carried:
          type: integer
          description: The dependencies carried with a reason for the CVEs they keep
        jumps:
          type: integer
          description: The packages its major jumps move
      required:
        - updated
        - cvesBefore
        - carried
        - jumps
    Ecosystem:
      type: string
      enum:
        - npm
        - pip
      description: >
        The archive's ecosystem. On an archive, its folder's. On a report, the
        manifest's once it is read, and the folder's before.
    LatestImport:
      type: object
      description: The newest import of the archive and manifest now in MinIO, matched by key and ETag; absent when an upload has replaced either since
      properties:
        id:
          type: string
        outcome:
          type: string
          description: queued, running, complete, incomplete, refused, interrupted or cancelled
      required:
        - id
        - outcome
    StartImport:
      type: object
      properties:
        archive:
          type: string
          description: The archive's object key, under packages/npm/ or packages/pip/
        expectedSha256:
          type: string
          description: The archive's sha256 received through a separate channel, 64 hex digits; a different archive is refused
      required:
        - archive
    RetryImport:
      type: object
      description: An empty object retries the whole import.
      properties:
        packages:
          type: array
          description: >
            The file names of the packages to upload, each a failed package of
            the latest attempt, none twice. Absent or empty retries the whole
            import.
          items:
            type: string
    ImportList:
      type: object
      properties:
        imports:
          type: array
          items:
            $ref: "#/components/schemas/Import"
      required:
        - imports
    Object:
      type: object
      description: A MinIO object as it was when the import was created
      properties:
        key:
          type: string
        etag:
          type: string
        size:
          type: integer
          format: int64
      required:
        - key
        - etag
        - size
    Import:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        archive:
          $ref: "#/components/schemas/Object"
        manifest:
          $ref: "#/components/schemas/Object"
        signature:
          $ref: "#/components/schemas/Object"
        expectedSha256:
          type: string
        outcome:
          type: string
          description: The latest attempt's outcome, or queued or running while it has none
        archiveRemoved:
          type: boolean
          description: >
            Whether an attempt removed the archive from MinIO. A complete
            attempt removes the archive and its manifest only after checking
            that both still carry the ETags it read; its removal says why not.
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
        queueAhead:
          type: integer
          description: >
            How many attempts run or wait before the latest one in the
            service's queue, whoever started them. Present only while the
            latest attempt is queued in this service; never stored, so absent
            from every import read after it left the queue.
      required:
        - id
        - createdAt
        - archive
        - manifest
        - expectedSha256
        - outcome
        - archiveRemoved
        - attempts
    Attempt:
      type: object
      properties:
        n:
          type: integer
        status:
          type: string
          description: queued, running or ended
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        outcome:
          type: string
          description: complete, incomplete, refused, interrupted or cancelled once the attempt has ended
        retry:
          type: array
          description: >
            The file names this attempt was asked to upload, the packages of
            one cause. Absent on a first attempt, on a whole retry, and on an
            attempt recorded by sealift 0.7.0 or earlier.
          items:
            type: string
        report:
          $ref: "#/components/schemas/Report"
        removal:
          $ref: "#/components/schemas/Removal"
      required:
        - n
        - status
        - outcome
        - report
    Removal:
      type: object
      description: What became of the archive after a complete attempt
      properties:
        removed:
          type: boolean
        reason:
          type: string
      required:
        - removed
        - reason
    Report:
      type: object
      description: The account of one attempt; a package still pending has not ended
      properties:
        outcome:
          type: string
          description: complete, incomplete, refused, interrupted or cancelled; empty while the attempt runs
        reason:
          type: string
        unencrypted:
          type: boolean
          description: True when Nexus, MinIO or the key set is reached over plain http
        importVersion:
          type: string
        archive:
          $ref: "#/components/schemas/ReportArchive"
        toolVersion:
          type: string
        analysisId:
          type: string
        ecosystem:
          $ref: "#/components/schemas/Ecosystem"
        target:
          $ref: "#/components/schemas/ReportTarget"
        nexus:
          $ref: "#/components/schemas/ReportNexus"
        counts:
          $ref: "#/components/schemas/ReportCounts"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/ReportPackage"
        archiveChecked:
          type: boolean
          description: >
            True when the archive passed its checks against the manifest and
            the signature key, false when the attempt ended or stands before
            they passed. Absent in a report written by sealift 0.4.0 or earlier.
        publicKeySha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The sha256 of the public key the attempt checked the signature with. Absent in a report written by sealift 0.4.0 or earlier.
        crossing:
          $ref: "#/components/schemas/Crossing"
          description: >
            The crossing the signed manifest names, set once the signature
            verifies. Absent before, and from a report written by sealift
            0.7.0 or earlier.
      required:
        - outcome
        - reason
        - unencrypted
        - importVersion
        - archive
        - toolVersion
        - analysisId
        - target
        - nexus
        - counts
        - packages
    ReportArchive:
      type: object
      properties:
        file:
          type: string
        sha256:
          type: string
        size:
          type: integer
          format: int64
      required:
        - file
        - sha256
        - size
    ReportTarget:
      type: object
      properties:
        os:
          type: string
        cpu:
          type: string
        libc:
          type: string
        node:
          type: string
        pnpmVer:
          type: string
        python:
          type: string
          description: The Python version of a pip archive's target; empty for an npm archive
        glibc:
          type: string
          description: The glibc version of a pip archive's target; empty for an npm archive
      required:
        - os
        - cpu
        - libc
        - node
        - pnpmVer
    ReportNexus:
      type: object
      properties:
        url:
          type: string
        repository:
          type: string
      required:
        - url
        - repository
    ReportCounts:
      type: object
      properties:
        published:
          type: integer
        present:
          type: integer
        failed:
          type: integer
      required:
        - published
        - present
        - failed
    ReportPackage:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        file:
          type: string
        state:
          type: string
          description: pending, published, present or failed
        reason:
          type: string
        note:
          type: string
        kind:
          type: string
          enum:
            - conflict
            - nexus
            - source
            - interrupted
            - mismatch
            - local
          description: >
            Why a failed package failed: conflict (Nexus holds this version
            with other bytes), nexus (Nexus refused, did not answer or served
            other bytes after the upload), source (the archive could not be
            read from MinIO), interrupted (the service stopped before the
            package ended), mismatch (the tarball is not the package the
            manifest names), local (a file or the Nexus client on the import's
            own side failed). Set on a failed package only. Absent in a report
            written by sealift 0.4.0 or earlier.
      required:
        - name
        - version
        - file
        - state
        - reason
        - note
    ImportConflict:
      type: object
      description: A Problem that names the import in the way
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        importId:
          type: string
          description: The import that holds the archive; absent when MinIO is not configured
      required:
        - title
        - status
    Problem:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem type
          default: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type
        status:
          type: integer
          description: The HTTP status code repeated for clients that read the body only
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence
      required:
        - title
        - status
