name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    name: smoke test (native amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build for the runner's own architecture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: sealift:smoke-test
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      # Blocks the build and the publish when the image carries a fixable
      # high or critical vulnerability.
      - name: scan the image
        run: trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress sealift:smoke-test
      - name: healthz, volume permissions, cap_setuid and cap_setgid
        run: |
          docker run -d --name sealift-smoke -v sealift-smoke-data:/data -p 18080:8080 sealift:smoke-test
          for _ in $(seq 1 20); do curl -sf http://localhost:18080/healthz && break; sleep 0.5; done
          curl -sf http://localhost:18080/healthz
          docker exec sealift-smoke id | grep -q 'uid=10000(app) gid=2000(data)'
          docker exec -u 10001:2000 sealift-smoke sh -c 'echo ok > /data/smoke.txt'
          docker exec -u 10001:2000 sealift-smoke sh -c '! cat /data/private/settings.json'
          docker exec sealift-smoke sh -c 'test -d "$HOME"'
          docker rm -f sealift-smoke
          docker volume rm sealift-smoke-data

  build:
    name: build (${{ matrix.arch }}, native)
    permissions:
      contents: read
      packages: write
    needs: smoke-test
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive the version to stamp into the binary
        id: version
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "value=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi
      - name: build for this runner's own architecture, and push on main or a release tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/morgankryze/sealift:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}

  merge-manifest:
    name: merge into one multi-arch manifest
    permissions:
      contents: read
      packages: write
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create one manifest from the two native builds
        env:
          REF: ${{ github.ref }}
        run: |
          tags=(-t "ghcr.io/morgankryze/sealift:${{ github.sha }}")
          if [[ "$REF" == refs/tags/v* ]]; then
            version="${REF#refs/tags/v}"
            tags+=(-t "ghcr.io/morgankryze/sealift:$version" -t "ghcr.io/morgankryze/sealift:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "ghcr.io/morgankryze/sealift:${{ github.sha }}-amd64" \
            "ghcr.io/morgankryze/sealift:${{ github.sha }}-arm64"

  chart:
    name: publish the chart
    needs: merge-manifest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: package the chart and push it next to the image
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm package charts/sealift --version "$version" --app-version "$version"
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          if ! out=$(helm push "sealift-${version}.tgz" oci://ghcr.io/morgankryze/charts 2>&1); then
            echo "::error::helm push failed: $out"
            exit 1
          fi
