name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  smoke-test:
    name: smoke test (native amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build for the runner's own architecture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: sealift:smoke-test
      - name: healthz, volume permissions, cap_setuid and cap_setgid
        run: |
          docker run -d --name sealift-smoke -v sealift-smoke-data:/data -p 18080:8080 sealift:smoke-test
          for _ in $(seq 1 20); do curl -sf http://localhost:18080/healthz && break; sleep 0.5; done
          curl -sf http://localhost:18080/healthz
          docker exec sealift-smoke id | grep -q 'uid=10000(app) gid=2000(data)'
          docker exec -u 10001:2000 sealift-smoke sh -c 'echo ok > /data/smoke.txt'
          docker exec -u 10001:2000 sealift-smoke sh -c '! cat /data/private/settings.json'
          docker exec sealift-smoke sh -c 'test -d "$HOME"'
          docker rm -f sealift-smoke
          docker volume rm sealift-smoke-data

  build:
    name: build (${{ matrix.arch }}, native)
    needs: smoke-test
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build for this runner's own architecture, and push on main or a release tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/morgankryze/sealift:${{ github.sha }}-${{ matrix.arch }}

  merge-manifest:
    name: merge into one multi-arch manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create one manifest from the two native builds
        env:
          REF: ${{ github.ref }}
        run: |
          tags=(-t "ghcr.io/morgankryze/sealift:${{ github.sha }}")
          if [[ "$REF" == refs/tags/v* ]]; then
            version="${REF#refs/tags/v}"
            tags+=(-t "ghcr.io/morgankryze/sealift:$version" -t "ghcr.io/morgankryze/sealift:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "ghcr.io/morgankryze/sealift:${{ github.sha }}-amd64" \
            "ghcr.io/morgankryze/sealift:${{ github.sha }}-arm64"
