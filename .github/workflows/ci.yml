name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      # The sums come from golangci-lint-2.15.0-checksums.txt. Pinning them
      # here also catches a release asset replaced after the fact.
      - name: install golangci-lint
        env:
          VERSION: 2.15.0
          SHA256_AMD64: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
          SHA256_ARM64: b4d8f17068b35ee6060cc2f69a16fb48740d706fbba81661c318649c114a6998
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 sum=$SHA256_AMD64 ;;
            ARM64) arch=arm64 sum=$SHA256_ARM64 ;;
            *) echo "no pinned golangci-lint for $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          name=golangci-lint-$VERSION-linux-$arch
          url=https://github.com/golangci/golangci-lint/releases/download/v$VERSION
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$name.tar.gz" "$url/$name.tar.gz"
          curl -fsSL --retry 3 -o checksums.txt "$url/golangci-lint-$VERSION-checksums.txt"
          grep -qx "$sum  $name.tar.gz" checksums.txt
          echo "$sum  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: golangci-lint
        run: golangci-lint run ./...
      - name: test
        run: go test -race ./...

  # Reports only the vulnerable code the module calls.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  integration:
    name: integration (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: integration tests
        run: go test -tags integration -race ./...

  # Runs what `just chart` runs.
  chart:
    name: chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: lint and render the chart
        run: |
          helm lint --strict charts/sealift -f charts/testdata/values.yaml
          SEALIFT_CHART=1 go test -count=1 ./charts/

  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm -C web install --frozen-lockfile
      - name: typecheck
        run: pnpm -C web run typecheck
      - name: lint
        run: pnpm -C web run lint
      - name: test
        run: pnpm -C web run test
      - name: docs links
        run: node --test scripts/check-docs.test.mjs && node scripts/check-docs.mjs
      - name: build
        run: pnpm -C web run build

  e2e:
    name: e2e (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: end-to-end test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker compose -f test/e2e/docker-compose.yml up --abort-on-container-exit --exit-code-from test
      - name: compose down
        if: always()
        run: docker compose -f test/e2e/docker-compose.yml down --volumes
