# The import service sits behind oauth2-proxy the way the air-gapped side runs it:
# nginx asks oauth2-proxy on every request and forwards the access token.
server {
    listen 18440;
    client_max_body_size 200M;
    proxy_http_version 1.1;

    location /oauth2/ {
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host $http_host;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        # A refreshed session answers with a new cookie of several KiB next
        # to the token headers; the default 4k buffer cuts it with a 500.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$http_host$request_uri;

        auth_request_set $token $upstream_http_x_auth_request_access_token;
        auth_request_set $user $upstream_http_x_auth_request_preferred_username;
        # A refreshed session comes back as a new cookie. $upstream_http_set_cookie
        # holds one header, enough while the session fits one 4 KiB cookie.
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        proxy_set_header X-Access-Token $token;
        proxy_set_header X-Auth-Request-Access-Token $token;
        proxy_set_header X-Auth-Request-Preferred-Username $user;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://import-server:8080;
    }
}

server {
    listen 18441;
    client_max_body_size 0;
    location / {
        proxy_pass http://nexus:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 18442;
    client_max_body_size 0;
    location / {
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 18443;
    client_max_body_size 0;
    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
    }
}

server {
    listen 18444;
    location / {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
